# Review-only template. For API-pull deployment, run this HTTPS gateway on the
# Bridge VPS. The local Node Agent calls it outbound; no tunnel to the PC is used.
# Choose an authorized hostname, trusted certificate and network access policy.
server {
    listen 443 ssl;
    server_name bridge.example.invalid;
    ssl_certificate /REPLACE/WITH/TRUSTED/fullchain.pem;
    ssl_certificate_key /REPLACE/WITH/TRUSTED/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Avoid logging task IDs, URLs, credentials or request bodies.
    access_log off;

    location /bridge/v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        # Preserve streamed bytes and all non-2xx API errors, never retry POST.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_intercept_errors off;
        proxy_next_upstream off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        client_body_timeout 90s;
        # Leave transport headroom over Bridge's 16 MiB per-reference limit.
        client_max_body_size 32m;
    }
    location /bridge/node/v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        # Node uploads may contain a Codex original up to the existing 16 MiB cap.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_intercept_errors off;
        proxy_next_upstream off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        client_body_timeout 90s;
        client_max_body_size 16m;
    }
    # Dispatcher, engine, database, admin and CLI interfaces remain private.
    location / { return 404; }
}
