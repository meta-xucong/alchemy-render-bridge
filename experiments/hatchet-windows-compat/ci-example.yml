# Proposed standalone workflow; not a production dependency adoption.
name: Experimental Hatchet platform lifecycle
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    defaults:
      run:
        working-directory: experiments/hatchet-windows-compat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-upstream.txt
      - run: python probe_upstream.py
      - run: python -m pip download --no-deps --dest .cache hatchet-sdk==1.42.1
      - run: python build_candidate.py .cache/hatchet_sdk-1.42.1-py3-none-any.whl
      - run: python verify_candidate.py
      - run: python -m pip install --no-deps --force-reinstall dist/hatchet_sdk-1.42.1+bridgewin1-py3-none-any.whl
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
