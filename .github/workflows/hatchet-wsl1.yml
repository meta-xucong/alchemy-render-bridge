name: Experimental WSL1 loopback preflight
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/hatchet-wsl1-integration/**'
      - '.github/workflows/hatchet-wsl1.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    defaults:
      run:
        working-directory: experiments/hatchet-wsl1-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests (no external services)
        run: python -m unittest discover -s tests -v
      - name: Existing WSL1 and verified official Ubuntu loopback probe
        run: python preflight.py
      - name: Always clean up only our temporary distro
        if: always()
        run: python preflight.py --cleanup
      - name: Upload non-secret capability result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wsl1-preflight-result
          path: experiments/hatchet-wsl1-integration/result.json
          if-no-files-found: warn
          retention-days: 7
